# Rebuilds the development branch and deploys it to staging. development is
# not a working branch: each run builds it from scratch out of the tip of the
# production branch and every open, non-draft pull request into it
# (scripts/ci/build-development.sh), force-pushes it, and deploys it with
# `scripts/ci/deploy.sh staging`. The composition goes to the run summary.
#
# Triggers: a push to production; a pull request into production opened,
# reopened, closed, made ready for review, converted to draft, or retargeted
# to or away from production; a run by hand, which can be a dry run. A push
# to the branch of a pull request does not rebuild.
#
# Pull request events come through pull_request_target, so the workflow file
# and the bot's scripts always come from production, never from the branch of
# the pull request. deploy.sh is the production copy too, run inside the
# build. The code of the pull requests still runs while the Cabinet's deploy.sh
# builds it, next to the DEV_* deploy secrets, as it does in any staging
# build; only branches of this repository get into it, never forks.
#
# Only the bot may write to development (ruleset `development`), and a branch
# ruleset cannot let GITHUB_TOKEN through, so the push goes through the bot's
# GitHub App token. No token is left in the git config: each git command that
# talks to GitHub gets its credentials in GIT_CONFIG_* for itself alone, so the
# deploy, which builds code of the pull requests, holds neither token.
#
# The job runs in the `staging` environment, whose secrets (BOT_PRIVATE_KEY
# and, in the Cabinet, the DEV_* deploy secrets) are released only to runs on
# the production branch; pull_request_target runs on the default branch,
# which is production.
#
# Builds share one concurrency group, and a new one cancels the one running:
# it starts from a fresher list, so staging never goes back to an older one.
# Dry runs have a group of their own, so that one never cancels a real build.
#
# The job is not called `build`: the skipped runs on every push would show
# on pull requests under the name of the required `build` check.
#
# Filters on branches live in the job condition, not under `on:`, because
# `on:` cannot read repository variables.

name: Development build

on:
  push:
    branches: ['**']
  pull_request_target:
    types: [opened, reopened, closed, ready_for_review, converted_to_draft, edited]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run - only report what development would be built from
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write

jobs:
  development:
    if: >-
      (github.event_name == 'workflow_dispatch')
      || (github.event_name == 'push' && github.ref_name == vars.PRODUCTION_BRANCH)
      || (github.event_name == 'pull_request_target' && github.event.action != 'edited'
        && github.base_ref == vars.PRODUCTION_BRANCH)
      || (github.event_name == 'pull_request_target' && github.event.action == 'edited'
        && github.event.changes.base != null
        && (github.base_ref == vars.PRODUCTION_BRANCH
          || github.event.changes.base.ref.from == vars.PRODUCTION_BRANCH))
    runs-on: ubuntu-24.04
    environment: staging
    concurrency:
      group: development-build${{ inputs.dry_run && '-dry-run' || '' }}
      cancel-in-progress: true

    steps:
      - name: Check the repository variables
        env:
          PRODUCTION_BRANCH: ${{ vars.PRODUCTION_BRANCH }}
          DEVELOPMENT_BRANCH: ${{ vars.DEVELOPMENT_BRANCH }}
          BOT_CLIENT_ID: ${{ vars.BOT_CLIENT_ID }}
        run: |
          failed=0
          for name in PRODUCTION_BRANCH DEVELOPMENT_BRANCH BOT_CLIENT_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Repository variable ${name} is not set"
              failed=1
            fi
          done
          exit "$failed"

      # Pushing a build that changes a workflow file takes the workflows
      # permission on top of contents.
      - name: Get the bot token
        id: bot
        if: ${{ !inputs.dry_run }}
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-workflows: write

      - uses: actions/checkout@v7
        with:
          ref: ${{ vars.PRODUCTION_BRANCH }}
          fetch-depth: 0
          persist-credentials: false

      - name: Build development
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRODUCTION_BRANCH: ${{ vars.PRODUCTION_BRANCH }}
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: http.https://github.com/.extraheader
          GIT_AUTHOR_NAME: Development build
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: Development build
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          credentials="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w 0)"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${credentials}"
          scripts/ci/build-development.sh "$RUNNER_TEMP/development"

      - name: Report the dry run
        if: ${{ inputs.dry_run }}
        run: echo "Dry run - nothing was pushed or deployed." >> "$GITHUB_STEP_SUMMARY"

      - name: Push development
        if: ${{ !inputs.dry_run }}
        env:
          DEVELOPMENT_BRANCH: ${{ vars.DEVELOPMENT_BRANCH }}
          BOT_TOKEN: ${{ steps.bot.outputs.token }}
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: http.https://github.com/.extraheader
        run: |
          credentials="$(printf 'x-access-token:%s' "$BOT_TOKEN" | base64 -w 0)"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${credentials}"
          git -C "$RUNNER_TEMP/development" push --force origin "HEAD:refs/heads/${DEVELOPMENT_BRANCH}"

      # The Cabinet's deploy.sh reads the DEV_* secrets; the sandbox has none
      # and its deploy.sh needs none.
      - name: Deploy to staging
        if: ${{ !inputs.dry_run }}
        working-directory: ${{ runner.temp }}/development
        env:
          DEV_DEPLOY_KEY: ${{ secrets.DEV_DEPLOY_KEY }}
          DEV_DEPLOY_HOST: ${{ secrets.DEV_DEPLOY_HOST }}
          DEV_DEPLOY_USER: ${{ secrets.DEV_DEPLOY_USER }}
          DEV_DEPLOY_PATH: ${{ secrets.DEV_DEPLOY_PATH }}
          DEV_DEPLOY_MANIFEST_PATH: ${{ secrets.DEV_DEPLOY_MANIFEST_PATH }}
        run: '"$GITHUB_WORKSPACE/scripts/ci/deploy.sh" staging'

      - name: Tell the pull requests from forks why they are not on staging
        if: ${{ !inputs.dry_run && steps.build.outputs.fork_prs != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FORK_PRS: ${{ steps.build.outputs.fork_prs }}
        run: |
          marker='<!-- development-build:fork -->'
          for number in $FORK_PRS; do
            if gh pr view "$number" --json comments --jq '.comments[].body' | grep -qF "$marker"; then
              continue
            fi
            gh pr comment "$number" --body "${marker}
          This pull request comes from a fork, and the development build takes only branches of this repository, so it is not on staging. Push the branch to this repository and open the pull request from there."
          done
